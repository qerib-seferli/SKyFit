<!doctype html><html lang="az" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><title>Profil | SKy Fit</title></head><body><div data-header></div><main class="section"><div class="shell"><div class="card profile-hero neon"><img id="avatar" class="avatar"><div><span class="muted">Xoş gəldiniz</span><h1 id="profileName">Üzv</h1><p id="profileEmail" class="muted"></p></div><button class="btn btn-danger" style="margin-left:auto" onclick="SkyAuth.logout()">Çıxış</button></div><div class="grid grid-2" style="margin-top:14px"><div id="membership"></div><div id="debt"></div></div><div class="grid grid-2" style="margin-top:14px"><section class="card"><h2>Profil məlumatları</h2><form id="profileForm" class="form-grid"><input class="input" name="full_name" placeholder="Ad Soyad"><input class="input" name="phone" placeholder="Telefon"><input class="input" name="birth_date" type="date"><textarea class="input" name="address" placeholder="Ünvan"></textarea><input class="input" name="avatar" type="file" accept="image/*"><button class="btn btn-primary">Yadda saxla</button></form></section><section class="card"><h2>Son alışlar</h2><div class="table-wrap"><table class="table" style="min-width:100%"><thead><tr><th>Tarix</th><th>Məbləğ</th><th>Status</th></tr></thead><tbody id="history"></tbody></table></div></section></div></div></main><div data-footer></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script type="module" src="js/profile.js"></script><script type="module" src="js/auth.js"></script></body></html>
