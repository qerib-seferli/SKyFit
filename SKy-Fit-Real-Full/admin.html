<!doctype html><html lang="az" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><title>Admin | SKy Fit</title></head><body><div data-header></div><div class="app-layout"><aside class="sidebar"><div class="side-nav"><button data-panel="dashboard">▦ Dashboard</button><button data-panel="pos">◉ Tez satış</button><button data-panel="members">♟ Üzvlər</button><button data-panel="debts">₼ Borclar</button><button data-panel="products">▣ Məhsullar</button><button data-panel="ledger">≡ Dəftər</button><button data-panel="reports">⌁ Hesabatlar</button></div></aside><main class="main"><div class="split"><div><span class="muted" id="adminName">Admin</span><h1 id="pageTitle">İdarəetmə paneli</h1></div><button class="btn" onclick="location.reload()">Yenilə</button></div>
<section id="panel-dashboard" class="panel"><div id="stats" class="stats"></div></section>
<section id="panel-pos" class="panel"><div class="pos-grid"><div><div class="toolbar"><input id="posSearch" class="input" placeholder="Məhsul axtar"><select id="posMember" class="input"></select></div><div id="posProducts" class="catalog-grid"></div></div><aside class="card"><h2>Səbət</h2><div id="cartLines"></div><div class="summary-row total"><span>Yekun</span><span id="cartTotal">0 AZN</span></div><select id="paymentMethod" class="input"><option value="cash">Nağd</option><option value="card">Kart</option><option value="transfer">Köçürmə</option></select><select id="paymentStatus" class="input" style="margin-top:8px"><option value="paid">Ödənilib</option><option value="debt">Borca yaz</option></select><button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="completeSale()">Satışı tamamla</button></aside></div></section>
<section id="panel-members" class="panel"><div class="toolbar"><button class="btn btn-primary" onclick="openNewMember()">+ Yeni üzv</button><button class="btn" onclick="openMembership()">+ Abunəlik</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Üzv</th><th>Plan</th><th>Başlama</th><th>Bitmə</th><th>Status</th><th></th></tr></thead><tbody id="membersTable"></tbody></table></div></section>
<section id="panel-debts" class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Üzv</th><th>Telefon</th><th>Borc</th><th>Yenilənmə</th><th></th></tr></thead><tbody id="debtsTable"></tbody></table></div></section>
<section id="panel-products" class="panel"><div class="toolbar"><button class="btn btn-primary" onclick="editProduct()">+ Yeni məhsul</button><button class="btn" onclick="addStock()">+ Stok daxil et</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Məhsul</th><th>Satış tipi</th><th>Qalıq</th><th>Porsiya</th><th>Qiymət</th><th>Status</th><th></th></tr></thead><tbody id="productsTable"></tbody></table></div></section>
<section id="panel-ledger" class="panel"><div class="toolbar"><button class="btn btn-primary" onclick="openLedger()">+ Yeni qeyd</button><input id="ledgerFrom" class="input" type="date"><input id="ledgerTo" class="input" type="date"><button class="btn" onclick="loadLedger()">Göstər</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Tarix</th><th>Tip</th><th>Kateqoriya</th><th>Açıqlama</th><th>Məbləğ</th></tr></thead><tbody id="ledgerTable"></tbody></table></div></section>
<section id="panel-reports" class="panel"><div class="toolbar"><input id="reportFrom" class="input" type="date"><input id="reportTo" class="input" type="date"><button class="btn" onclick="loadReports()">Hesabla</button></div><div id="reportStats" class="stats" style="grid-template-columns:repeat(3,1fr)"></div><div class="card" style="margin-top:14px"><canvas id="reportChart" class="chart"></canvas><p class="muted">Yaşıl: mədaxil · Qırmızı: məxaric</p></div></section>
</main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script type="module" src="js/admin.js"></script></body></html>
